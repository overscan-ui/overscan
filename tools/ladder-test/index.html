<!doctype html>
<meta charset="utf-8">
<title>ov-ladder tests</title>
<!-- Over tools/serve.py: /tools/ladder-test/ . The last case is a CONTROL that must fail. -->
<link rel="stylesheet" href="../../src/tokens.css">
<link rel="stylesheet" href="../../src/finish.css">
<link rel="stylesheet" href="../../src/ladder.css">
<style>
  body { margin: 0; background: #08080a; color: #ccc; font: 12px ui-monospace, monospace; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; padding: 16px 24px; align-items: start; }
  .cap { color: #888; margin-block-end: 6px; }
  #tests { white-space: pre; color: #9f9; padding: 16px 24px; }
  #tests.fail { color: #f77; }
</style>
<section class="ov ov-finish row" data-ov-theme="cyber" id="a"></section>
<div id="tests">running…</div>
<script type="module">
  import { ladDerive } from '../../src/ov-ladder.js';
  await customElements.whenDefined('ov-ladder');
  const NAMES = ['pointing', 'carrier', 'subcarrier', 'symbol', 'frame sync', 'decode'];
  const chain = (states, extra = {}) => ({ stages: NAMES.map((name, i) => ({ name, ...(typeof states[i] === 'string' ? { state: states[i], declared: states[i] === 'locked' } : states[i] || {}), ...(extra[i] || {}) })) });
  const mk = (cap, data) => { const d = document.createElement('div'); d.innerHTML = `<div class="cap">${cap}</div>`; const el = document.createElement('ov-ladder'); d.append(el); document.getElementById('a').append(d); el.chain = data; return el; };
  const data = mk('every rung locked', chain(['locked', 'locked', 'locked', 'locked', 'locked', 'locked']));
  const carrier = mk('carrier lock only', chain(['locked', 'locked', 'acquiring', 'off', 'off', 'off']));
  const undeclared = mk('reported locked, not declared', chain(['locked', { state: 'locked', declared: false }, 'off', 'off', 'off', 'off']));
  const early = mk('inside the first detection period', chain(['locked', 'locked', { state: 'locked', declared: true, since: 0.4, period: 1 }, 'off', 'off', 'off']));
  const held = mk('downstream reports lock, upstream does not', chain(['locked', 'acquiring', 'off', 'locked', 'locked', 'off']));
  const silent = mk('no reports', { stages: NAMES.map((name) => ({ name })) });
  const none = mk('nothing', null);
  const st = (el, name) => el.querySelector(`.ov-ladder__rung[data-stage="${name}"]`).className.match(/is-(locked|acquiring|off|noreport|held)/)[1];
  const head = (el) => el.querySelector('.ov-ladder__head').textContent;
  const cases = [
    ['every rung locked is RECEIVING DATA', () => head(data) === 'RECEIVING DATA' && data.getAttribute('data-ov-lock') === 'data'],
    ['⭐ carrier lock is not data', () => head(carrier) === 'LOCKED THROUGH CARRIER: NOT RECEIVING DATA'],
    ['a lock not declared by the detector is ACQUIRING', () => st(undeclared, 'carrier') === 'acquiring' && undeclared.textContent.includes('not declared by the lock detector')],
    ['inside the first detection period is ACQUIRING', () => st(early, 'subcarrier') === 'acquiring' && early.textContent.includes('0.4s of 1s')],
    ['a downstream lock under an unlocked rung is not believed, and not lit', () => st(held, 'symbol') === 'held' && st(held, 'frame sync') === 'held' && !held.querySelector('.ov-ladder__rung[data-stage="symbol"].is-chain')],
    ['the spine is lit only through the unbroken lock', () => carrier.querySelectorAll('.is-chain').length === 2 && data.querySelectorAll('.is-chain').length === 6],
    ['no report is its own state, not OFF', () => st(silent, 'carrier') === 'noreport' && head(silent) === 'NOTHING LOCKED: NOT RECEIVING DATA'],
    ['the head never says receiving data unless the last rung is locked', () => [carrier, undeclared, early, held, silent].every((e) => !head(e).startsWith('RECEIVING'))],
    ['derivation is order-sensitive and pure', () => { const d = ladDerive([{ name: 'a', state: 'off' }, { name: 'b', state: 'locked', declared: true }]); return d[1].status === 'held'; }],
    ['no chain is a refusal', () => none.getAttribute('data-ov-refusal') === 'unknown'],
    ['CONTROL: a false claim is caught', () => head(carrier) === 'RECEIVING DATA'],
  ];
  let bad = 0;
  const res = cases.map(([name, fn]) => { let r = false; try { r = !!fn(); } catch (e) { r = false; } const c = name.startsWith('CONTROL'); const pass = c ? !r : r; if (!pass) bad += 1; return `${pass ? 'ok  ' : 'FAIL'} ${name}${c ? ' (must fail)' : ''}`; });
  const t = document.getElementById('tests'); t.textContent = `${cases.length - bad} of ${cases.length} pass\n` + res.join('\n'); t.classList.toggle('fail', bad > 0);
  window.ladResults = { total: cases.length, bad, out: res };
</script>
